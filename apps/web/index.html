<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1011" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Manor" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https://assets.unicorn.studio https://logos.composio.dev http://localhost:43179 http://127.0.0.1:43179 http://localhost:8787 http://127.0.0.1:8787; font-src 'self'; frame-src 'self' http://localhost:43179 http://127.0.0.1:43179 http://localhost:8787 http://127.0.0.1:8787; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https: http://127.0.0.1:43179 http://localhost:43179" />
    <title>Manor</title>
    <script>
      // Before the first paint, so a light-mode reload never flashes the dark room.
      // Kept in sync with useTheme.ts: same key, same fallback, and `system` is the
      // absence of a stored value. Dark on anything unexpected, including a browser
      // with no storage and no colour preference to offer.
      try {
        var stored = localStorage.getItem('manor:theme')
        var choice = stored === 'light' || stored === 'dark' ? stored : null
        var light = choice ? choice === 'light' : matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
